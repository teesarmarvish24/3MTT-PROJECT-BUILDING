<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoPickup — Waste Pickup Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth screen -->
  <section id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <h1 class="logo">Eco<span>Pickup</span></h1>
      <p class="tagline">Reliable waste pickup, scheduled your way.</p>

      <div class="auth-tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-register" class="tab" type="button">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Full name
          <input type="text" name="name" required autocomplete="name" />
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password (min. 6 characters)
          <input type="password" name="password" required minlength="6" autocomplete="new-password" />
        </label>
        <label>Default pickup address
          <input type="text" name="address" placeholder="e.g. 12 Marina Road, Lagos" />
        </label>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p id="auth-error" class="error-msg hidden"></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="app-screen hidden">
    <header class="topbar">
      <h1 class="logo small">Eco<span>Pickup</span></h1>
      <div class="topbar-right">
        <div class="dropdown-wrap">
          <button id="notif-btn" class="icon-btn notif-btn" type="button" title="Reminders">
            🔔<span id="notif-badge" class="notif-badge hidden">0</span>
          </button>
          <div id="notif-dropdown" class="dropdown hidden">
            <div class="dropdown-title">Upcoming pickups (next 2 days)</div>
            <ul id="notif-list" class="notif-list"></ul>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle dark mode">🌙</button>
        <div class="dropdown-wrap">
          <button id="user-menu-btn" class="avatar-btn" type="button" title="Account"></button>
          <div id="user-dropdown" class="dropdown hidden">
            <div class="dropdown-title" id="user-dropdown-name"></div>
            <button id="profile-btn" class="dropdown-item" type="button">Profile</button>
            <button id="logout-btn" class="dropdown-item" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="reminder-banner" class="reminder-banner hidden">
        <span id="reminder-text"></span>
      </div>

      <div class="stats" id="stats"></div>

      <div class="view-header">
        <h2>Your pickups</h2>
        <div class="view-toolbar">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="scheduled">Scheduled</option>
            <option value="collected">Collected</option>
            <option value="missed">Missed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <select id="filter-waste-type">
            <option value="">All waste types</option>
            <option value="general">General</option>
            <option value="recyclable">Recyclable</option>
            <option value="organic">Organic</option>
            <option value="hazardous">Hazardous</option>
          </select>
          <button id="new-pickup-btn" class="btn btn-primary" type="button">+ Schedule pickup</button>
        </div>
      </div>

      <ul id="pickup-list" class="pickup-list"></ul>
      <p id="empty-state" class="empty-state hidden">No pickups yet. Click <strong>+ Schedule pickup</strong> to book your first one.</p>
    </main>
  </section>

  <!-- Pickup modal -->
  <div id="pickup-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Schedule a pickup</h2>
        <button id="modal-close" class="icon-btn" type="button" title="Close">✕</button>
      </div>
      <form id="pickup-form">
        <input type="hidden" name="id" />
        <label>Waste type
          <select name="waste_type" required>
            <option value="general">General</option>
            <option value="recyclable">Recyclable</option>
            <option value="organic">Organic</option>
            <option value="hazardous">Hazardous</option>
          </select>
        </label>
        <label>Pickup address
          <input type="text" name="address" required maxlength="200" />
        </label>
        <div class="form-row">
          <label>Date
            <input type="date" name="scheduled_date" required />
          </label>
          <label>Time window
            <select name="time_window">
              <option value="morning">Morning (8am–12pm)</option>
              <option value="afternoon">Afternoon (12pm–4pm)</option>
              <option value="evening">Evening (4pm–8pm)</option>
            </select>
          </label>
          <label>Repeats
            <select name="recurrence">
              <option value="none">Doesn't repeat</option>
              <option value="weekly">Weekly</option>
              <option value="biweekly">Every 2 weeks</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
        </div>
        <label>Notes (optional)
          <textarea name="notes" rows="2" maxlength="300" placeholder="e.g. Leave bins by the gate"></textarea>
        </label>
        <p id="modal-error" class="error-msg hidden"></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save pickup</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Feedback modal -->
  <div id="feedback-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Rate this pickup</h2>
        <button id="feedback-modal-close" class="icon-btn" type="button" title="Close">✕</button>
      </div>
      <form id="feedback-form">
        <div class="form-group">
          <span class="form-group-label">Rating</span>
          <div id="star-picker" class="star-picker">
            <button type="button" class="star" data-value="1">★</button>
            <button type="button" class="star" data-value="2">★</button>
            <button type="button" class="star" data-value="3">★</button>
            <button type="button" class="star" data-value="4">★</button>
            <button type="button" class="star" data-value="5">★</button>
          </div>
          <input type="hidden" name="rating" required />
        </div>
        <label>Comment (optional)
          <textarea name="comment" rows="3" maxlength="400" placeholder="How did it go?"></textarea>
        </label>
        <p id="feedback-error" class="error-msg hidden"></p>
        <div class="modal-actions">
          <button type="button" id="feedback-modal-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit feedback</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Profile modal -->
  <div id="profile-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Your profile</h2>
        <button id="profile-modal-close" class="icon-btn" type="button" title="Close">✕</button>
      </div>
      <form id="profile-form">
        <label>Full name
          <input type="text" name="name" required maxlength="120" />
        </label>
        <label>Email
          <input type="email" name="email" disabled />
        </label>
        <label>Default pickup address
          <input type="text" name="address" maxlength="200" />
        </label>
        <p id="profile-error" class="error-msg hidden"></p>
        <p id="profile-success" class="success-msg hidden"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
      <hr class="modal-divider" />
      <form id="password-form">
        <h3>Change password</h3>
        <label>Current password
          <input type="password" name="current_password" required autocomplete="current-password" />
        </label>
        <label>New password (min. 6 characters)
          <input type="password" name="new_password" required minlength="6" autocomplete="new-password" />
        </label>
        <p id="password-error" class="error-msg hidden"></p>
        <p id="password-success" class="success-msg hidden"></p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
